name: 垂直切片
description: 定义最小可独立交付与验证的业务垂直切片，通过双层测试驱动开发
title: "feat([context]-slice-[N]): "
labels: ["type/slice"]
body:
  - type: markdown
    attributes:
      value: |
        ## 垂直切片研发任务
        垂直切片是包含领域逻辑、端口与适配器的最小端到端闭环，通过解除验收场景忽略标记驱动开发。

  - type: input
    id: parent_feature
    attributes:
      label: 所属父特性
      description: 关联的父特性 Issue 编号或链接
      placeholder: "#123"
    validations:
      required: true

  - type: textarea
    id: slice_scope
    attributes:
      label: 切片范围与业务不变量
      description: 说明本切片聚焦的具体业务场景、聚合根状态变迁与领域规则
      placeholder: 实现订单创建请求的校验、聚合根持久化与领域事件发布...
    validations:
      required: true

  - type: textarea
    id: target_scenarios
    attributes:
      label: 目标验收场景
      description: 列出本切片负责解除忽略标记并实现通过的验收场景
      placeholder: - @scenario-order-001: 客户成功创建包含有效商品的订单
    validations:
      required: true

  - type: checkboxes
    id: delivery_checklist
    attributes:
      label: 交付门禁核对
      options:
        - label: 领域聚合根与值对象单元测试全部通过
          required: true
        - label: 目标验收场景解除忽略标记且测试通过
          required: true
        - label: 适配器实现通过端口契约校验
          required: true
        - label: 代码通过静态检查与代码风格门禁
          required: true
