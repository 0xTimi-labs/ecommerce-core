name: "Vertical Slice: 业务垂直切片 (Slice Sub-Issue)"
description: "端到端垂直切片研发任务，贯穿 Domain、Port、Adapter 与 BDD 双层 TDD"
title: "feat([context]-slice-[N]): [切片具体功能名称]"
labels: ["type/feature", "type/slice"]
body:
  - type: markdown
    attributes:
      value: |
        ### 🍰 垂直切片开发指南
        垂直切片是最小可端到端验证的业务闭环。必须严格按照双层 TDD（外层 BDD 验收测试 + 内层领域单元测试）驱动开发。

  - type: input
    id: parent-epic
    attributes:
      label: 1. 所属父 Feature Epic
      description: 关联的父 Issue 编号或链接
      placeholder: "#123"
    validations:
      required: true

  - type: textarea
    id: slice-scope
    attributes:
      label: 2. 切片范围与业务闭环 (Scope & Invariants)
      description: 本切片聚焦的具体业务场景、聚合根状态变迁与领域不变量
      placeholder: "本切片实现订单创建并推进至待预授权状态..."
    validations:
      required: true

  - type: textarea
    id: bdd-target-scenarios
    attributes:
      label: 3. 解除 `@ignore` 的目标 BDD 场景
      description: 明确本切片将把哪些 Cucumber Scenario 从 `@ignore` 解除并使其由红转绿
      placeholder: "- @scenario-order-001: 客户成功创建包含有效商品的订单"
    validations:
      required: true

  - type: checkboxes
    id: tdd-checklist
    attributes:
      label: 4. 双层 TDD 交付门禁
      options:
        - label: "内层 TDD：领域聚合与值对象单元测试全覆盖 (100% 绿色)"
          required: true
        - label: "外层 TDD：目标 BDD Scenario 移除 `@ignore` 且验收测试通过"
          required: true
        - label: "真实适配器或内存适配器完成实现并通过端口测试"
          required: true
        - label: "通过 `cargo clippy --workspace --all-targets` 0 告警"
          required: true
