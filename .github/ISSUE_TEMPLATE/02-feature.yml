name: "Feature: 业务特性史诗 (Feature Epic)"
description: "定义端到端的完整业务特性，作为垂直切片的父 Issue"
title: "feat([context]): [业务特性名称]"
labels: ["type/feature", "stage/feature-epic"]
body:
  - type: markdown
    attributes:
      value: |
        ### 🎯 Feature Epic 规划指南
        Feature Epic 定义完整的端到端业务能力，由多个按业务流划分的垂直切片（Vertical Slices）组成。

  - type: textarea
    id: feature-overview
    attributes:
      label: 1. 业务特性概述与价值 (Overview)
      description: 阐明此特性的业务背景、目标用户与商业价值
      placeholder: "作为 [用户/角色]，我希望 [进行什么操作]，以便于 [达成什么业务目标]..."
    validations:
      required: true

  - type: textarea
    id: bounded-contexts
    attributes:
      label: 2. 涉及的限界上下文 (Bounded Contexts)
      description: 明确本特性跨越或归属的上下文（如 Ordering, Payment, Inventory）
      placeholder: "- 订单上下文 (Ordering)\n- 支付上下文 (Payment)..."
    validations:
      required: true

  - type: textarea
    id: vertical-slices-breakdown
    attributes:
      label: 3. 垂直切片拆解清单 (Vertical Slices Plan)
      description: 列出拆分出的各个可独立交付的垂直切片
      placeholder: "- [ ] Slice 1: 正向核心链路与内存持久化 (Sub-Issue #...)\n- [ ] Slice 2: 异常处理与逆向补偿链路 (Sub-Issue #...)\n- [ ] Slice 3: 真实数据库/外部网关适配器接入 (Sub-Issue #...)"
    validations:
      required: true
