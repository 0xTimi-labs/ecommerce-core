name: "Integration: 最终端到端集成验收 (Final Integration)"
description: "跨上下文全链路端到端集成验证与非功能性门禁核验"
title: "feat(integration): [全链路业务集成验证]"
labels: ["type/integration", "stage/final-integration"]
body:
  - type: markdown
    attributes:
      value: |
        ### 🚀 最终集成验收指南
        当所有垂直切片均已合入后，进行跨上下文端到端真实协同 Saga 演练与全量门禁审查。

  - type: textarea
    id: integration-scope
    attributes:
      label: 1. 全链路集成范围 (Integration Scope)
      description: 描述涵盖的三大上下文端到端交易流（下单 -> 预留 -> 授权 -> 请款 -> 履约）
      placeholder: "验证客户从提交订单、库存锁定、支付冻结到结算扣款的完整端到端 Saga..."
    validations:
      required: true

  - type: checkboxes
    id: final-checklist
    attributes:
      label: 2. 全量交付就绪门禁
      options:
        - label: "所有 BDD 场景的 `@ignore` 均已解除，`cargo test --workspace` 100% 跑通"
          required: true
        - label: "跨上下文事件驱动 Saga 闭环演练（含正向结算与逆向补偿）通过"
          required: true
        - label: "通过所有代码与制品安全审计 (Gitleaks, cargo-deny, Biome)"
          required: true
