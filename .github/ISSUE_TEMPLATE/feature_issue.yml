name: 业务特性
description: 定义完整的业务特性并拆解为可独立交付的垂直切片
title: "feat([context]): "
labels: ["type/feature"]
body:
  - type: markdown
    attributes:
      value: |
        ## 业务特性定义
        业务特性代表端到端的业务能力，由一组垂直切片按序交付完成。

  - type: textarea
    id: feature_summary
    attributes:
      label: 特性概述与用户价值
      description: 从用户视角描述特性的业务价值和使用场景
      placeholder: 作为 [用户角色]，我希望 [操作]，以便于 [达成业务目标]...
    validations:
      required: true

  - type: textarea
    id: bounded_contexts
    attributes:
      label: 涉及的限界上下文
      description: 列出本特性跨越或归属的上下文
      placeholder: "- 订单\n- 支付\n- 库存履约"
    validations:
      required: true

  - type: textarea
    id: slice_breakdown
    attributes:
      label: 垂直切片拆解计划
      description: 将该特性拆解为最小可闭环验证的切片清单及执行顺序
      placeholder: "1. 切片 1: 正向核心流程与内存仓储\n2. 切片 2: 异常分支与逆向补偿流程\n3. 切片 3: 真实适配器与持久化接入"
    validations:
      required: true
