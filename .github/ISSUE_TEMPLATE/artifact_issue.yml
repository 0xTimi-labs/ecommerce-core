name: 架构与契约制品
description: 提交领域模型、架构决策、Protobuf 契约、CloudEvents 事件模式或 BDD 规格定义等工程制品
title: "feat(arch): "
labels: ["type/architecture"]
body:
  - type: markdown
    attributes:
      value: |
        ## 制品定义与规范
        本模板适用于定义或变更架构设计、跨上下文契约网络、领域模型及验收规格。

  - type: dropdown
    id: artifact_type
    attributes:
      label: 制品类型
      description: 请选择本次交付或变更的核心制品类型
      options:
        - 架构设计与上下文地图
        - RPC 接口契约
        - 领域事件模式
        - 业务验收规格
        - 架构决策记录
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: 制品概述与业务背景
      description: 阐述该制品所属的限界上下文、业务目标及解决的核心问题
      placeholder: 描述制品的设计意图与业务背景...
    validations:
      required: true

  - type: textarea
    id: specification
    attributes:
      label: 详细规格与契约定义
      description: 列出具体的契约路径、数据模型字段、状态变迁或设计内容
      placeholder: 例如：contracts/proto/ordering/v1/ordering.proto 或 contracts/events/order-placed.v1.schema.json...
    validations:
      required: true

  - type: textarea
    id: bdd_scenarios
    attributes:
      label: 关联业务验收场景
      description: 列出对应的 Gherkin Feature 场景及 Scenario 标识
      placeholder: - @scenario-order-001: 客户成功创建有效订单...

  - type: checkboxes
    id: readiness_checklist
    attributes:
      label: 交付门禁核对
      options:
        - label: 契约定义符合协议规范并通过本地代码生成（如 buf generate）
          required: true
        - label: 事件模式符合规范并通过自动化契约测试
          required: true
        - label: 文档与上下文地图保持同步更新
          required: true
