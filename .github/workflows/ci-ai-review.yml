name: CI AI Review (On-Demand)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  ai-review:
    name: AI Review
    if: |
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/review') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # Node 24
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 0

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install Pi CLI
        run: bun add -g --ignore-scripts @earendil-works/pi-coding-agent

      - name: Restore Session Cache
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: .pi_session
          key: pi-session-${{ github.event.issue.number }}-${{ github.run_id }}
          restore-keys: |
            pi-session-${{ github.event.issue.number }}-

      - name: Configure Pi Auth
        if: env.DEEPSEEK_API_KEY != ''
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          mkdir -p ~/.pi/agent
          cat << EOF > ~/.pi/agent/auth.json
          {
            "deepseek": {
              "type": "api_key",
              "key": "$DEEPSEEK_API_KEY"
            }
          }
          EOF

      - name: Execute Review
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "DEEPSEEK_API_KEY not configured. Running dry-run check..."
            gh pr comment "$PR_NUMBER" --body "AI Reviewer: Review triggered (dry-run)." || true
            exit 0
          fi

          # 1. 识别分支类型：区分架构审查 (artifact) 与 代码切片审查 (code)
          HEAD_BRANCH=$(gh pr view "$PR_NUMBER" --json headRefName --jq .headRefName)
          if [[ "$HEAD_BRANCH" == feat/artifact-* ]]; then
            SKILL_FILE=".agents/skills/artifact-reviewer/SKILL.md"
            ROLE="架构与契约审查员"
          else
            SKILL_FILE=".agents/skills/code-reviewer/SKILL.md"
            ROLE="业务切片代码审查员"
          fi

          # 2. 解析指令参数 (/review vs /review -c)
          CONTINUE_FLAG=""
          if [[ "$COMMENT_BODY" =~ ^/review[[:space:]]+(-c|--continue) ]]; then
            if [ -d ".pi_session" ] && [ -n "$(ls -A .pi_session 2>/dev/null)" ]; then
              CONTINUE_FLAG="-c"
              PROMPT="开发者已更新代码并发出复核指令。请在当前会话中复核最新代码与反馈，依照 $SKILL_FILE 完成收敛判定。"
            else
              PROMPT="你是 $ROLE。当前正在开展 PR #${PR_NUMBER} 的审查。请结合 PR 历史评论记录进行审查，重点核验前序指出的问题是否已妥善修复，禁止横向发散新问题，依照 $SKILL_FILE 输出审查报告。"
            fi
          else
            rm -rf .pi_session && mkdir -p .pi_session
            PROMPT="你是 $ROLE。当前正在开展 PR #${PR_NUMBER} 的全量新审查。请全面扫描当前变更，依照 $SKILL_FILE 输出审查报告。"
          fi

          # 3. 运行 Pi（使用 DeepSeek 并启用 Max 思考等级）
          pi -p "$PROMPT" \
             --session-dir .pi_session \
             $CONTINUE_FLAG \
             --model deepseek/deepseek-v4-flash \
             --thinking max > review_report.md

          gh pr comment "$PR_NUMBER" --body-file review_report.md
