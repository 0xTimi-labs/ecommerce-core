name: CI AI Review

on:
  pull_request:
    types: [opened, labeled, ready_for_review]
    branches: [main]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  ai-review:
    name: AI Review Gate
    if: |
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft == false &&
       (contains(github.event.pull_request.labels.*.name, 'review/ready') ||
        github.event.action == 'ready_for_review' ||
        github.event.action == 'opened')) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       startsWith(github.event.comment.body, '/review') &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # Node 24
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || format('refs/pull/{0}/head', github.event.issue.number) }}
          fetch-depth: 0

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install Pi CLI
        run: bun add -g --ignore-scripts @earendil-works/pi-coding-agent

      - name: Install and Initialize RTK
        run: |
          curl -fsSL https://raw.githubusercontent.com/rtk-ai/rtk/refs/heads/master/install.sh | sh
          echo "$HOME/.cargo/bin:$HOME/.local/bin" >> $GITHUB_PATH
          export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH"
          rtk init --agent pi --global

      - name: Restore Session Cache
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: .pi_session
          key: pi-session-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.run_id }}
          restore-keys: |
            pi-session-${{ github.event.pull_request.number || github.event.issue.number }}-

      - name: Configure Pi Auth
        if: env.DEEPSEEK_API_KEY != ''
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          mkdir -p ~/.pi/agent
          cat << EOF > ~/.pi/agent/auth.json
          {
            "deepseek": {
              "type": "api_key",
              "key": "$DEEPSEEK_API_KEY"
            }
          }
          EOF

      - name: Execute Agentic Review
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH"

          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "DEEPSEEK_API_KEY not configured. Skipping..."
            exit 0
          fi

          PR_LABELS=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name')
          if echo "$PR_LABELS" | grep -q "type/architecture"; then
            SKILL_FILE=".agents/skills/artifact-reviewer/SKILL.md"
            ROLE="架构与契约审查员"
          else
            SKILL_FILE=".agents/skills/code-reviewer/SKILL.md"
            ROLE="Feature 代码审查员"
          fi

          CONTINUE_FLAG=""
          if [ "$EVENT_NAME" = "issue_comment" ] && [[ "$COMMENT_BODY" =~ ^/review[[:space:]]+(-c|--continue) ]]; then
            if [ -d ".pi_session" ] && [ -n "$(ls -A .pi_session 2>/dev/null)" ]; then
              CONTINUE_FLAG="-c"
              PROMPT="你是 $ROLE。开发者已更新代码并发出复核指令。请在当前会话中复核最新代码与开发者反馈，依照 $SKILL_FILE 完成收敛判定，并使用 gh CLI 工具直接在 PR #${PR_NUMBER} 下发布审查报告回复。若判定通过请为 PR 添加 review/approved 标签并移除 review/changes-requested，若存在阻断问题请添加 review/changes-requested 标签。"
            else
              PROMPT="你是 $ROLE。当前正在开展 PR #${PR_NUMBER} 的复核。请结合 PR 历史评论记录全面审查当前变更，重点确认前序问题是否已妥善解决，禁止横向发散新问题，依照 $SKILL_FILE 完成收敛判定，并使用 gh CLI 工具直接在 PR #${PR_NUMBER} 发布审查报告回复及更新 review 标签。"
            fi
          else
            rm -rf .pi_session && mkdir -p .pi_session
            PROMPT="你是 $ROLE。当前正在开展 PR #${PR_NUMBER} 的全量审查。请全面扫描当前变更，依照 $SKILL_FILE 完成判定，并使用 gh CLI 工具直接在 PR #${PR_NUMBER} 下发布审查报告。若判定通过请为 PR 添加 review/approved 标签，若存在阻断问题请添加 review/changes-requested 标签。"
          fi

          pi -p "$PROMPT" \
             --session-dir .pi_session \
             $CONTINUE_FLAG \
             --model deepseek/deepseek-v4-flash \
             --thinking max
