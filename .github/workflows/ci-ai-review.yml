name: CI AI Review

on:
  pull_request:
    types: [opened, labeled, ready_for_review]
    branches: [main]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  ai-review:
    name: AI Review Gate
    if: |
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft == false &&
       (github.event.action == 'opened' ||
        github.event.action == 'ready_for_review' ||
        (github.event.action == 'labeled' && github.event.label.name == 'review/ready') ||
        contains(github.event.pull_request.labels.*.name, 'review/ready'))) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       startsWith(github.event.comment.body, '/review') &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # Node 24
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || format('refs/pull/{0}/head', github.event.issue.number) }}
          fetch-depth: 0

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install Pi CLI
        run: bun add -g --ignore-scripts @earendil-works/pi-coding-agent

      - name: Install and Initialize RTK
        run: |
          curl -fsSL https://raw.githubusercontent.com/rtk-ai/rtk/refs/heads/master/install.sh | sh
          echo "$HOME/.cargo/bin:$HOME/.local/bin" >> $GITHUB_PATH
          export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH"
          rtk init --agent pi --global

      - name: Restore Session Cache
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: .pi_session
          key: pi-session-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.run_id }}
          restore-keys: |
            pi-session-${{ github.event.pull_request.number || github.event.issue.number }}-

      - name: Configure Pi Auth
        if: env.DEEPSEEK_API_KEY != ''
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          mkdir -p ~/.pi/agent
          cat << EOF > ~/.pi/agent/auth.json
          {
            "deepseek": {
              "type": "api_key",
              "key": "$DEEPSEEK_API_KEY"
            }
          }
          EOF

      - name: Run Review Orchestrator (Typed FSM)
        run: bun run scripts/ci-review-orchestrator.ts
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REPO: ${{ github.repository }}
