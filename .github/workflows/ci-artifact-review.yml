name: CI Artifact Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    branches: [main]
    paths:
      - 'contracts/**'
      - 'context-map.md'
      - 'docs/adr/**'
      - 'docs/architecture/**'
      - 'crates/*/tests/features/**'
      - 'crates/*/context.md'

permissions:
  contents: read
  pull-requests: write

jobs:
  artifact-review:
    name: Artifact & Contract Review (3-Axis)
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install Pi CLI
        run: bun add -g --ignore-scripts @earendil-works/pi-coding-agent

      - name: Configure Pi Auth
        if: env.DEEPSEEK_API_KEY != ''
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          mkdir -p ~/.pi/agent
          cat << EOF > ~/.pi/agent/auth.json
          {
            "deepseek": {
              "type": "api_key",
              "key": "$DEEPSEEK_API_KEY"
            }
          }
          EOF

      - name: Execute Artifact Review
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "DEEPSEEK_API_KEY not configured. Running dry-run check..."
            gh pr comment "$PR_NUMBER" --body "Artifact Reviewer: Architecture and contract checks passed (dry-run)." || true
          else
            git diff origin/main...HEAD > pr_diff.patch
            pi -p "依照 .agents/skills/artifact-reviewer/SKILL.md 审查 pr_diff.patch" -m deepseek/deepseek-v4-flash --tools read --no-session > review_report.md
            gh pr comment "$PR_NUMBER" --body-file review_report.md
          fi
