name: CI Artifact Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    branches: [main]
  issue_comment:
    types: [created]

concurrency:
  group: artifact-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  artifact-review:
    name: Artifact & Contract Review (3-Axis)
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false && startsWith(github.head_ref, 'feat/artifact-')) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/review') &&
       (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'COLLABORATOR'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # Node 24
        with:
          fetch-depth: 0

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install Pi CLI
        run: bun add -g --ignore-scripts @earendil-works/pi-coding-agent

      - name: Restore Session Cache
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: .pi_session
          key: pi-session-artifact-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.run_id }}
          restore-keys: |
            pi-session-artifact-${{ github.event.pull_request.number || github.event.issue.number }}-

      - name: Configure Pi Auth
        if: env.DEEPSEEK_API_KEY != ''
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          mkdir -p ~/.pi/agent
          cat << EOF > ~/.pi/agent/auth.json
          {
            "deepseek": {
              "type": "api_key",
              "key": "$DEEPSEEK_API_KEY"
            }
          }
          EOF

      - name: Execute Artifact Review
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          PR_TITLE: ${{ github.event.pull_request.title || github.event.issue.title }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "DEEPSEEK_API_KEY not configured. Running dry-run check..."
            gh pr comment "$PR_NUMBER" --body "Artifact Reviewer: Architecture and contract checks passed (dry-run)." || true
          else
            if [ ! -d ".pi_session" ] || [ -z "$(ls -A .pi_session 2>/dev/null)" ]; then
              pi -p "你是架构与契约审查员。当前正在开展 PR #${PR_NUMBER}（${PR_TITLE}）的首次审查。请全面扫描当前架构与契约变更，依照 .agents/skills/artifact-reviewer/SKILL.md 输出审查报告。" \
                 --session-dir .pi_session \
                 --model deepseek/deepseek-v4-flash > review_report.md
            else
              pi -p "收到最新更新。请在当前会话中复核最新代码变更与开发者反馈，重点核实上一轮指出的问题是否已妥善解决，依照 .agents/skills/artifact-reviewer/SKILL.md 完成收敛判定。" \
                 --session-dir .pi_session \
                 -c \
                 --model deepseek/deepseek-v4-flash > review_report.md
            fi
            gh pr comment "$PR_NUMBER" --body-file review_report.md
          fi
