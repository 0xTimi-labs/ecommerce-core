name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security-and-license:
    name: Security & License Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4.2.2
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@bcfb9cce635345aac9996cedc19b2de8e01b894f # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Cargo Dependencies & Licenses
        if: hashFiles('crates/**/Cargo.toml') != ''
        uses: EmbarkStudios/cargo-deny-action@9c67a826e39827395bfa619cd85cb2aaeb43cfaa # v2.0.1
        with:
          command: check

  contract-lint:
    name: Protobuf Contract Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4.2.2
        with:
          fetch-depth: 0

      - name: Install Buf CLI
        run: |
          BIN_DIR="$HOME/.local/bin"
          mkdir -p "$BIN_DIR"
          curl -sSL "https://github.com/bufbuild/buf/releases/latest/download/buf-Linux-x86_64" -o "$BIN_DIR/buf"
          chmod +x "$BIN_DIR/buf"
          echo "$BIN_DIR" >> $GITHUB_PATH

      - name: Lint Protobuf Contracts
        run: |
          if find contracts/proto -name '*.proto' 2>/dev/null | grep -q .; then
            buf lint
          else
            echo "No proto files found in contracts/proto yet. Skipping buf lint."
          fi

      - name: Check Breaking Changes
        if: github.event_name == 'pull_request'
        run: |
          if git ls-tree -r origin/main --name-only | grep -q '\.proto$'; then
            buf breaking --against '.git#branch=main'
          else
            echo "Baseline main branch has no proto contracts yet. Skipping breaking check for initial bootstrap."
          fi

  rust-check-and-test:
    name: Rust Checks & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4.2.2

      - name: Install Buf CLI
        run: |
          BIN_DIR="$HOME/.local/bin"
          mkdir -p "$BIN_DIR"
          curl -sSL "https://github.com/bufbuild/buf/releases/latest/download/buf-Linux-x86_64" -o "$BIN_DIR/buf"
          chmod +x "$BIN_DIR/buf"
          echo "$BIN_DIR" >> $GITHUB_PATH

      - name: Generate Code from Protobuf Contracts
        run: |
          if find contracts/proto -name '*.proto' 2>/dev/null | grep -q .; then
            buf generate
          fi

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.7.7

      - name: Check Formatting
        run: |
          if [ -n "$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | .name')" ]; then
            cargo fmt --all -- --check
          else
            echo "No workspace member packages. Skipping fmt check."
          fi

      - name: Clippy Linter
        run: |
          if [ -n "$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | .name')" ]; then
            cargo clippy --workspace --all-targets --all-features -- -D warnings
          else
            echo "No workspace member packages. Skipping clippy check."
          fi

      - name: Run Unit, BDD Acceptance & Event Schema Tests
        run: |
          if [ -n "$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | .name')" ]; then
            cargo test --workspace
          else
            echo "No workspace member packages. Skipping tests."
          fi

  frontend-check:
    name: Frontend Typecheck & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4.2.2

      - name: Install Buf CLI
        run: |
          BIN_DIR="$HOME/.local/bin"
          mkdir -p "$BIN_DIR"
          curl -sSL "https://github.com/bufbuild/buf/releases/latest/download/buf-Linux-x86_64" -o "$BIN_DIR/buf"
          chmod +x "$BIN_DIR/buf"
          echo "$BIN_DIR" >> $GITHUB_PATH

      - name: Generate Code from Protobuf Contracts
        run: |
          if find contracts/proto -name '*.proto' 2>/dev/null | grep -q .; then
            buf generate
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: bun install --frozen-lockfile

      - name: Run Frontend Lint & Typecheck
        working-directory: apps/web
        run: bun run check
