name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  security-and-license:
    name: Security & License Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4.2.2
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          BIN_DIR="$HOME/.local/bin"
          mkdir -p "$BIN_DIR"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz" | tar -xz -C "$BIN_DIR" gitleaks
          chmod +x "$BIN_DIR/gitleaks"
          echo "$BIN_DIR" >> $GITHUB_PATH

      - name: Gitleaks Secret Scan
        run: gitleaks detect --redact --verbose

      - name: Check Cargo Dependencies & Licenses
        if: hashFiles('crates/**/Cargo.toml') != ''
        uses: EmbarkStudios/cargo-deny-action@9c67a826e39827395bfa619cd85cb2aaeb43cfaa # v2.0.1
        with:
          command: check

  contract-lint:
    name: Protobuf Contract Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4.2.2
        with:
          fetch-depth: 0

      - name: Install Buf CLI
        run: |
          BIN_DIR="$HOME/.local/bin"
          mkdir -p "$BIN_DIR"
          curl -sSL "https://github.com/bufbuild/buf/releases/latest/download/buf-Linux-x86_64" -o "$BIN_DIR/buf"
          chmod +x "$BIN_DIR/buf"
          echo "$BIN_DIR" >> $GITHUB_PATH

      - name: Lint Protobuf Contracts
        run: |
          if find contracts/proto -name '*.proto' 2>/dev/null | grep -q .; then
            buf lint
          else
            echo "No proto files found in contracts/proto yet. Skipping buf lint."
          fi

      - name: Check Breaking Changes
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main:refs/remotes/origin/main --depth=1 || true
          if git rev-parse --verify origin/main >/dev/null 2>&1 && git ls-tree -r origin/main --name-only | grep -q '\.proto$'; then
            buf breaking --against '.git#branch=origin/main'
          else
            echo "Baseline origin/main branch has no proto contracts yet. Skipping breaking check for initial bootstrap."
          fi

  rust-check-and-test:
    name: Rust Checks & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4.2.2

      - name: Install Buf CLI
        run: |
          BIN_DIR="$HOME/.local/bin"
          mkdir -p "$BIN_DIR"
          curl -sSL "https://github.com/bufbuild/buf/releases/latest/download/buf-Linux-x86_64" -o "$BIN_DIR/buf"
          chmod +x "$BIN_DIR/buf"
          echo "$BIN_DIR" >> $GITHUB_PATH

      - name: Generate Code from Protobuf Contracts
        run: |
          if find contracts/proto -name '*.proto' 2>/dev/null | grep -q .; then
            buf generate
          fi

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.7.7

      - name: Check Formatting
        run: |
          if [ -n "$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | .name')" ]; then
            cargo fmt --all -- --check
          else
            echo "No workspace member packages. Skipping fmt check."
          fi

      - name: Clippy Linter
        run: |
          if [ -n "$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | .name')" ]; then
            cargo clippy --workspace --all-targets --all-features -- -D warnings
          else
            echo "No workspace member packages. Skipping clippy check."
          fi

      - name: Run Unit, BDD Acceptance & Event Schema Tests
        run: |
          if [ -n "$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | .name')" ]; then
            cargo test --workspace
          else
            echo "No workspace member packages. Skipping tests."
          fi

  frontend-check:
    name: Frontend Typecheck & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4.2.2

      - name: Install Buf CLI
        run: |
          BIN_DIR="$HOME/.local/bin"
          mkdir -p "$BIN_DIR"
          curl -sSL "https://github.com/bufbuild/buf/releases/latest/download/buf-Linux-x86_64" -o "$BIN_DIR/buf"
          chmod +x "$BIN_DIR/buf"
          echo "$BIN_DIR" >> $GITHUB_PATH

      - name: Generate Code from Protobuf Contracts
        run: |
          if find contracts/proto -name '*.proto' 2>/dev/null | grep -q .; then
            buf generate
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: bun install --frozen-lockfile

      - name: Run Frontend Lint & Typecheck
        working-directory: apps/web
        run: bun run check

  ai-review-gate:
    name: AI Review Gate
    needs: [security-and-license, contract-lint, rust-check-and-test, frontend-check]
    if: |
      always() &&
      needs.security-and-license.result == 'success' &&
      needs.contract-lint.result == 'success' &&
      needs.rust-check-and-test.result == 'success' &&
      needs.frontend-check.result == 'success' &&
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install Pi CLI
        run: bun add -g --ignore-scripts @earendil-works/pi-coding-agent

      - name: Install and Initialize RTK
        run: |
          curl -fsSL https://raw.githubusercontent.com/rtk-ai/rtk/refs/heads/master/install.sh | sh
          echo "$HOME/.cargo/bin:$HOME/.local/bin" >> $GITHUB_PATH
          export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH"
          rtk init --agent pi --global

      - name: Restore Session Cache
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: .pi_session
          key: pi-session-${{ github.event.pull_request.number }}-${{ github.run_id }}
          restore-keys: |
            pi-session-${{ github.event.pull_request.number }}-

      - name: Configure Pi Auth
        if: env.DEEPSEEK_API_KEY != ''
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          mkdir -p ~/.pi/agent
          cat << EOF > ~/.pi/agent/auth.json
          {
            "deepseek": {
              "type": "api_key",
              "key": "$DEEPSEEK_API_KEY"
            }
          }
          EOF

      - name: Run Review Orchestrator (Typed FSM)
        run: bun run .github/scripts/ci-review.ts
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ''
          REPO: ${{ github.repository }}
