name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security-and-license:
    name: Security & License Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@e811c750b3cb1c5e9f89fb0e5bfb04d1c1cf6cf9 # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency Review (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@abeac294b46c6b3602120015509930f769068007 # v4.9.0

      - name: Check Cargo Dependencies & Licenses
        if: hashFiles('Cargo.toml') != ''
        uses: EmbarkStudios/cargo-deny-action@8371184b99c5a887734d7e37b5b4705cb4f5c656 # v2.0.11
        with:
          command: check

  contract-lint:
    name: Protobuf Contract Check
    if: hashFiles('contracts/buf.yaml') != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@e6d97c5e263ab21e35a11c1d81dbdd45c1106cf2 # v1.50.0

      - name: Lint Protobuf Contracts
        uses: bufbuild/buf-lint-action@06f9dd9e36814b184206e78d38e217fb75f1b13b # v1.1.1
        with:
          input: contracts

      - name: Check Breaking Changes
        if: github.event_name == 'pull_request'
        uses: bufbuild/buf-breaking-action@184918e974e64f89dcf8cfd9ea313c01c0cf9cb3 # v1.1.4
        with:
          input: contracts
          against: 'https://github.com/${{ github.repository }}.git#branch=main'

  rust-check-and-test:
    name: Rust Checks & Tests
    if: hashFiles('Cargo.toml') != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@7b766865e5730b1b8414a8934358f64848274d23 # stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@82a92a6e8fbeee08c6c4da5271996f54d38e7de7 # v2.7.7

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Clippy Linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Unit & Unlocked BDD Tests
        run: cargo test --workspace -- --skip ignore

  frontend-check:
    name: Frontend Typecheck & Lint
    if: hashFiles('apps/web/package.json') != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf37fdd5 # v2

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: bun install --frozen-lockfile

      - name: Run Frontend Typecheck
        working-directory: apps/web
        run: bun run check
