name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security-and-license:
    name: Security & License Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # Node 24
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@bcfb9cce635345aac9996cedc19b2de8e01b894f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Cargo Dependencies & Licenses
        if: hashFiles('crates/**/Cargo.toml') != ''
        uses: EmbarkStudios/cargo-deny-action@9c67a826e39827395bfa619cd85cb2aaeb43cfaa
        with:
          command: check

  contract-lint:
    name: Protobuf Contract & Schema Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # Node 24
        with:
          fetch-depth: 0

      - name: Setup Buf CLI
        uses: bufbuild/buf-setup-action@fbb91772b52752bd36ca8552d2ff4b94e111f24f
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint Protobuf Contracts
        run: |
          if find contracts/proto -name '*.proto' 2>/dev/null | grep -q .; then
            buf lint
          else
            echo "No proto files found in contracts/proto yet. Skipping buf lint."
          fi

      - name: Check Breaking Changes
        if: github.event_name == 'pull_request'
        run: |
          if git ls-tree -r origin/main --name-only | grep -q '\.proto$'; then
            buf breaking --against '.git#branch=main'
          else
            echo "Baseline main branch has no proto contracts yet. Skipping breaking check for initial bootstrap."
          fi

  rust-check-and-test:
    name: Rust Checks, BDD Tests & Event Schema Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # Node 24

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16

      - name: Check Formatting
        run: |
          if [ -n "$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | .name')" ]; then
            cargo fmt --all -- --check
          else
            echo "No workspace member packages. Skipping fmt check."
          fi

      - name: Clippy Linter
        run: |
          if [ -n "$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | .name')" ]; then
            cargo clippy --workspace --all-targets --all-features -- -D warnings
          else
            echo "No workspace member packages. Skipping clippy check."
          fi

      - name: Run Unit, BDD Acceptance & Event Schema Tests
        run: |
          if [ -n "$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | .name')" ]; then
            cargo test --workspace
          else
            echo "No workspace member packages. Skipping tests."
          fi

  frontend-check:
    name: Frontend Linter & Typecheck (Biome + TS)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # Node 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: bun install --frozen-lockfile

      - name: Run Frontend Lint & Typecheck
        working-directory: apps/web
        run: bun run check
