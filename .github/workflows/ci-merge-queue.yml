name: CI Merge Queue

on:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  merge-queue-validation:
    name: Speculative Merge Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # Node 24

      - name: Check if Cargo exists
        id: check-rust
        run: |
          if [ -f Cargo.toml ]; then
            echo "has_rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_rust=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust Stable
        if: steps.check-rust.outputs.has_rust == 'true'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        if: steps.check-rust.outputs.has_rust == 'true'
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.7.7

      - name: Full Workspace Build & Clippy
        if: steps.check-rust.outputs.has_rust == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Execute All Validated Tests
        if: steps.check-rust.outputs.has_rust == 'true'
        run: cargo test --workspace -- --skip ignore
