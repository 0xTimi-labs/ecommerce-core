name: CI Merge Queue

on:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  merge-queue-validation:
    name: Speculative Merge Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@7b766865e5730b1b8414a8934358f64848274d23 # stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@82a92a6e8fbeee08c6c4da5271996f54d38e7de7 # v2.7.7

      - name: Full Workspace Build & Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Execute All Validated Tests
        run: cargo test --workspace -- --skip ignore
