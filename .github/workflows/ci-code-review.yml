name: CI Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    branches: [main]

concurrency:
  group: code-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  code-review:
    name: Code & Slice Review (Dual-Axis)
    if: github.event.pull_request.draft == false && !startsWith(github.head_ref, 'feat/artifact-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # Node 24
        with:
          fetch-depth: 0

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install Pi CLI
        run: bun add -g --ignore-scripts @earendil-works/pi-coding-agent

      - name: Restore Session Cache
        uses: actions/cache@v4
        with:
          path: .pi_session
          key: pi-session-code-${{ github.event.pull_request.number }}-${{ github.run_id }}
          restore-keys: |
            pi-session-code-${{ github.event.pull_request.number }}-

      - name: Configure Pi Auth
        if: env.DEEPSEEK_API_KEY != ''
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          mkdir -p ~/.pi/agent
          cat << EOF > ~/.pi/agent/auth.json
          {
            "deepseek": {
              "type": "api_key",
              "key": "$DEEPSEEK_API_KEY"
            }
          }
          EOF

      - name: Execute Code Review
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "DEEPSEEK_API_KEY not configured. Running dry-run check..."
            gh pr comment "$PR_NUMBER" --body "Code Reviewer: Spec and standards checks passed (dry-run)." || true
          else
            pi -p "你是业务切片代码审查员。当前正在审查 PR #${PR_NUMBER}（${PR_TITLE}）。请查看 PR 评论历史与当前变更，依照 .agents/skills/code-reviewer/SKILL.md 展开审查。" --session-dir .pi_session --model deepseek/deepseek-v4-flash > review_report.md
            gh pr comment "$PR_NUMBER" --body-file review_report.md
          fi
