[workspace]
resolver = "3"
members = [
    "crates/wire-contracts",
    "crates/shared-kernel",
    "crates/ordering-api",
    "crates/ordering",
    "crates/payment-api",
    "crates/payment",
    "crates/inventory-api",
    "crates/inventory",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Architecture & Engineering Team"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
mod_module_files = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
async-trait = "0.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.0", features = ["full"] }
cucumber = { version = "0.23", features = ["libtest"] }
prost = "0.14"
tonic = "0.14"
tonic-prost = "0.14"
jsonschema = "0.28"
